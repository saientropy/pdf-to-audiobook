[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-audiobook"
version = "0.1.0"
description = "Turn a PDF into a narrated audiobook: an AI narrator that explains formulas, figures and tables, synced for read-along."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "numpy",
    "soundfile",
    "anthropic>=2.0",
    "pydantic>=2",
    "httpx",
    "kokoro-onnx>=0.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
audiobook = "audiobook.cli:main"

[tool.setuptools.packages.find]
include = ["audiobook*"]
