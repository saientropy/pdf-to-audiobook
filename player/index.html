<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Read-along">
  <title>Read-along Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%234da3ff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title" id="title">Read-along</div>
    <select id="chapters" aria-label="Chapter"></select>
    <button id="open" class="ghost" type="button">Open</button>
    <input id="files" type="file" multiple hidden>
  </header>

  <main id="pages" aria-label="Document pages">
    <div class="empty" id="empty">
      <p><strong>Open an audiobook.</strong></p>
      <p>Tap <em>Open</em> and select <code>book.json</code>, the PDF and the audio files together.</p>
      <p><a href="?demo=1">Or play the demo paper.</a></p>
    </div>
  </main>

  <section class="now" id="now" hidden>
    <div class="now-kind" id="nowKind"></div>
    <div class="now-text" id="nowText"></div>
  </section>

  <button id="follow" class="follow" type="button" hidden>Follow narration</button>

  <footer class="bar">
    <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Position">
    <div class="row">
      <span id="time" class="time">0:00</span>
      <div class="buttons">
        <button id="back" type="button" aria-label="Back 15 seconds">−15</button>
        <button id="play" class="play" type="button" aria-label="Play" disabled>Play</button>
        <button id="fwd" type="button" aria-label="Forward 15 seconds">+15</button>
      </div>
      <button id="speed" class="ghost" type="button" aria-label="Speed">1×</button>
    </div>
  </footer>

  <audio id="audio" preload="metadata" playsinline></audio>
  <div id="error" class="error" hidden></div>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
